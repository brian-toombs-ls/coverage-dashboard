<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegalSifter Coverage</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #111217;
      --surface:  #181b1f;
      --surface2: #1e2125;
      --border:   #2c3036;
      --border2:  #3a3f47;
      --text:     #d9dde3;
      --muted:    #8d9099;
      --muted2:   #4d535c;
      --accent:   #5794f2;
      --green:    #6ccf8e;
      --green-bg: #1a2e22;
      --yellow:   #f5a623;
      --yellow-bg:#2e2516;
      --red:      #f2495c;
      --red-bg:   #2e1520;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .logo-area h1 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .logo-area .subtitle {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .meta { font-size: 0.75rem; color: var(--muted); }

    /* ── Copy button ── */
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.45rem 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .copy-btn:hover { background: #4a84e8; }
    .copy-btn.copied { background: #3a7d5c; }

    /* ── KPI Row ── */
    .kpi-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 1000px) { .kpi-row { grid-template-columns: 1fr 1fr; } }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 0.35rem;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .stat-card.hero .stat-value { font-size: 2.6rem; }
    .stat-sub {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem 1.4rem;
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-title-note {
      color: var(--muted2);
      font-weight: 400;
      font-size: 0.68rem;
      letter-spacing: 0.03em;
    }


    /* ── Progress bar (pod) ── */
    .progress-wrap {
      background: var(--surface2);
      border-radius: 2px;
      height: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-bar { height: 100%; border-radius: 2px; }

    /* ── Service pod grid ── */
    .group-label {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.75rem 0 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .group-label:first-child { padding-top: 0; }
    .group-label .gl-count {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 0.35rem;
      font-size: 0.62rem;
      color: var(--muted2);
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .service-grid:last-child { margin-bottom: 0; }

    .service-pod {
      background: var(--surface);
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .pod-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .pod-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .pod-main {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .pod-pct {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      flex-shrink: 0;
      min-width: 3.5rem;
    }
    .pod-spark {
      flex: 1;
      position: relative;
      height: 44px;
      min-width: 0;
    }
    .pod-spark canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
    .pod-spark-empty {
      height: 44px;
      display: flex;
      align-items: center;
      color: var(--muted2);
      font-size: 0.7rem;
    }

    .pod-bar {
      height: 3px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }
    .pod-bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    .pod-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.68rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .pod-meta-sep { color: var(--muted2); }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-green  { background: var(--green-bg);  color: var(--green); }
    .badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
    .badge-red    { background: var(--red-bg);    color: var(--red); }
    .badge-grey   { background: var(--surface2);  color: var(--muted); }

    .source-tag { font-size: 0.68rem; color: var(--muted2); }

    .trend-up   { color: var(--green); font-size: 0.8rem; }
    .trend-down { color: var(--red);   font-size: 0.8rem; }
    .trend-flat { color: var(--muted); font-size: 0.8rem; }

    /* stale indicator */
    .stale-dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--yellow);
      margin-right: 4px;
      vertical-align: middle;
    }

    /* ── Filter row ── */
    .filter-row {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.28rem 0.7rem;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
    }
    .filter-btn:hover { border-color: var(--border2); color: var(--text); }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); }

    /* ── Empty state ── */
    .empty-note { color: var(--muted); font-size: 0.82rem; padding: 0.5rem 0; }

    /* ── Push date chip ── */
    .push-chip {
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .push-chip.stale { color: var(--yellow); }

    /* ── Secondary section ── */
    .secondary-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 900px) { .secondary-row { grid-template-columns: 1fr; } }

    .chart-wrap-sm { position: relative; height: 180px; }

    /* ── At-risk / insights list ── */
    .insight-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .insight-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 0.55rem 0.75rem;
      gap: 0.75rem;
    }
    .insight-name { font-size: 0.8rem; font-weight: 500; color: var(--text); }
    .insight-detail { font-size: 0.72rem; color: var(--muted); }
    .insight-pct { font-size: 0.85rem; font-weight: 700; }
    .insight-empty { color: var(--muted); font-size: 0.78rem; padding: 0.75rem 0; text-align: center; }
  </style>
</head>
<body>

<header>
  <div class="logo-area">
    <h1>Coverage Dashboard</h1>
    <div class="subtitle">LegalSifter microservices · unit test coverage</div>
  </div>
  <div class="header-right">
    <div class="meta" id="meta">Loading…</div>
    <button class="copy-btn" id="copyBtn" onclick="copyCoverage()">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/>
      </svg>
      Copy Numbers
    </button>
  </div>
</header>

<!-- KPI row -->
<div class="kpi-row" id="kpi-row"></div>

<!-- Secondary: fleet trend + insights -->
<div class="secondary-row" style="margin-bottom:1.5rem;">
  <div class="card">
    <div class="card-title">Fleet Average <span class="card-title-note">coverage over time</span></div>
    <div class="chart-wrap-sm"><canvas id="trendChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">At Risk <span class="card-title-note">active · below target</span></div>
    <div id="at-risk-list"></div>
  </div>
</div>

<!-- Service pods -->
<div class="card" style="margin-bottom:0;">
  <div class="card-title" style="margin-bottom:0.75rem;">
    Services
    <span class="card-title-note" id="service-count"></span>
  </div>
  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="green">≥ 80%</button>
    <button class="filter-btn" data-filter="warn">60–79%</button>
    <button class="filter-btn" data-filter="red">&lt; 60%</button>
    <button class="filter-btn" data-filter="na">No Data</button>
  </div>
  <div id="pod-container"></div>
</div>

<script>
  const CSV_URL    = "./coverage-history.csv";
  const TARGET     = 80;
  const STALE_DAYS = 30;

  // ── Helpers ──────────────────────────────────────────────────────────────

  function statusColor(pct) {
    if (pct === null) return "#2c3036";
    if (pct >= TARGET) return "#6ccf8e";
    if (pct >= 60)     return "#f5a623";
    return "#f2495c";
  }

  function badge(pct) {
    if (pct === null) return `<span class="badge badge-grey">N/A</span>`;
    if (pct >= TARGET) return `<span class="badge badge-green">${pct.toFixed(1)}%</span>`;
    if (pct >= 60)     return `<span class="badge badge-yellow">${pct.toFixed(1)}%</span>`;
    return                    `<span class="badge badge-red">${pct.toFixed(1)}%</span>`;
  }

  function trendLabel(delta) {
    if (delta === null) return `<span class="trend-flat">—</span>`;
    if (Math.abs(delta) < 0.1) return `<span class="trend-flat">stable</span>`;
    if (delta > 0) return `<span class="trend-up">▲ +${delta.toFixed(1)}%</span>`;
    return               `<span class="trend-down">▼ ${delta.toFixed(1)}%</span>`;
  }

  function daysSince(dateStr) {
    if (!dateStr) return null;
    return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
  }

  function pushLabel(pushedAt) {
    const days = daysSince(pushedAt);
    if (days === null) return null;
    if (days === 0) return { text: 'pushed today', stale: false };
    if (days === 1) return { text: 'pushed 1d ago', stale: false };
    return { text: `pushed ${days}d ago`, stale: days >= STALE_DAYS };
  }

  // ── Pod state ─────────────────────────────────────────────────────────────
  let filterState = 'all';
  let podData     = [];
  const sparkCharts = {};

  function priorityOf(r) {
    if (r.pct === null) return 3;
    if (r.pct < TARGET) return 1;
    return 2;
  }

  function renderPods() {
    for (const key of Object.keys(sparkCharts)) {
      sparkCharts[key].destroy();
      delete sparkCharts[key];
    }

    let rows = [...podData];
    if (filterState !== 'all') {
      rows = rows.filter(r => {
        if (filterState === 'green') return r.pct !== null && r.pct >= TARGET;
        if (filterState === 'warn')  return r.pct !== null && r.pct >= 60 && r.pct < TARGET;
        if (filterState === 'red')   return r.pct !== null && r.pct < 60;
        if (filterState === 'na')    return r.pct === null;
        return true;
      });
    }

    // Sort: below target (worst first) → at target (highest first) → no data
    rows.sort((a, b) => {
      const pa = priorityOf(a), pb = priorityOf(b);
      if (pa !== pb) return pa - pb;
      if (pa === 1) return (a.pct ?? 100) - (b.pct ?? 100);
      if (pa === 2) return (b.pct ?? 0) - (a.pct ?? 0);
      return a.name.localeCompare(b.name);
    });

    const container = document.getElementById('pod-container');
    container.innerHTML = '';

    const groupDefs = [
      { key: 1, label: 'Below Target', rows: rows.filter(r => priorityOf(r) === 1) },
      { key: 2, label: 'At Target',    rows: rows.filter(r => priorityOf(r) === 2) },
      { key: 3, label: 'No Data',      rows: rows.filter(r => priorityOf(r) === 3) },
    ];

    for (const group of groupDefs) {
      if (group.rows.length === 0) continue;

      const label = document.createElement('div');
      label.className = 'group-label';
      label.innerHTML = `${group.label} <span class="gl-count">${group.rows.length}</span>`;
      container.appendChild(label);

      const grid = document.createElement('div');
      grid.className = 'service-grid';
      container.appendChild(grid);

      for (const r of group.rows) {
        const color = statusColor(r.pct);
        const hasHistory = r.history && r.history.filter(h => h.pct !== null).length >= 2;
        const push = pushLabel(r.pushed_at);

        const pod = document.createElement('div');
        pod.className = 'service-pod';
        pod.innerHTML = `
          <div class="pod-header">
            <span class="pod-name">${r.name}</span>
            ${badge(r.pct)}
          </div>
          <div class="pod-main">
            <div class="pod-pct" style="color:${color}">${r.pct !== null ? r.pct.toFixed(1) + '%' : '—'}</div>
            ${hasHistory
              ? `<div class="pod-spark"><canvas id="spark-${r.name}"></canvas></div>`
              : `<div class="pod-spark-empty">no history</div>`}
          </div>
          <div class="pod-bar"><div class="pod-bar-fill" style="width:${Math.min(100, r.pct ?? 0)}%;background:${color}"></div></div>
          <div class="pod-meta">
            ${trendLabel(r.delta)}
            <span class="pod-meta-sep">·</span>
            <span>${r.date}</span>
            <span class="pod-meta-sep">·</span>
            <span class="source-tag">${r.source}</span>
            ${push ? `<span class="pod-meta-sep">·</span><span class="push-chip${push.stale ? ' stale' : ''}">${push.text}</span>` : ''}
          </div>
        `;
        grid.appendChild(pod);
      }
    }

    document.getElementById('service-count').textContent =
      `${rows.length} of ${podData.length}`;

    // Sparklines (after DOM is built)
    for (const r of rows) {
      if (!r.history) continue;
      const valid = r.history.filter(h => h.pct !== null);
      if (valid.length < 2) continue;
      const canvas = document.getElementById(`spark-${r.name}`);
      if (!canvas) continue;

      const color = statusColor(r.pct);
      const yValues = r.history.map(h => h.pct);
      const vals    = yValues.filter(v => v !== null);
      const spread  = Math.max(1, Math.max(...vals) - Math.min(...vals));
      const pad     = Math.max(2, spread * 0.3);
      const minY    = Math.max(0,   Math.min(...vals) - pad);
      const maxY    = Math.min(100, Math.max(...vals) + pad);

      sparkCharts[r.name] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: r.history.map(h => h.date),
          datasets: [{ data: yValues, borderColor: color,
            backgroundColor: color + '20', borderWidth: 1.5,
            pointRadius: 0, spanGaps: true, tension: 0.3, fill: true }],
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: { x: { display: false }, y: { display: false, min: minY, max: maxY } },
        },
      });
    }
  }

  // ── Copy ─────────────────────────────────────────────────────────────────
  function copyCoverage() {
    const lines = podData
      .slice().sort((a, b) => a.name.localeCompare(b.name))
      .map(r => `${r.name}: ${r.pct !== null ? r.pct.toFixed(1) + '%' : 'N/A'}`)
      .join('\n');
    navigator.clipboard.writeText(lines).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.classList.add('copied');
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 8 6 12 14 4"/></svg> Copied!`;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg> Copy Numbers`;
      }, 2200);
    });
  }

  // ── Load ─────────────────────────────────────────────────────────────────
  async function load() {
    const resp = await fetch(CSV_URL);
    const text = await resp.text();
    const { data } = Papa.parse(text, { header: true, skipEmptyLines: true });

    const byRepo = {};
    for (const row of data) {
      if (!byRepo[row.repo]) byRepo[row.repo] = [];
      byRepo[row.repo].push({
        date:      row.date,
        pct:       row.coverage_pct !== "" ? parseFloat(row.coverage_pct) : null,
        source:    row.source,
        pushed_at: row.repo_pushed_at || "",
      });
    }
    for (const r of Object.keys(byRepo)) {
      byRepo[r].sort((a, b) => a.date.localeCompare(b.date));
    }

    const allDates = [...new Set(data.map(r => r.date))].sort();
    const repos    = Object.keys(byRepo).sort();
    const lastDate = allDates[allDates.length - 1];

    const latest = {};
    for (const repo of repos) {
      const rows = byRepo[repo];
      latest[repo] = rows[rows.length - 1];
    }

    document.getElementById("meta").textContent =
      `${lastDate} · ${repos.length} services`;

    // ── Stats ──
    const validPcts    = repos.map(r => latest[r]?.pct).filter(p => p !== null);
    const avg          = validPcts.length ? validPcts.reduce((a, b) => a + b, 0) / validPcts.length : null;
    const atTarget     = validPcts.filter(p => p >= TARGET).length;
    const below60      = validPcts.filter(p => p < 60).length;
    const notReporting = repos.filter(r => latest[r]?.pct === null).length;
    const highest      = validPcts.length ? Math.max(...validPcts) : null;
    const highestRepo  = highest !== null ? repos.find(r => latest[r]?.pct === highest)?.split("/")[1] : null;
    const belowCount   = validPcts.length - atTarget;
    const targetColor  = atTarget === repos.length ? '#6ccf8e'
                       : atTarget >= repos.length * 0.7 ? '#f5a623' : '#f2495c';

    // ── KPI cards ──
    document.getElementById("kpi-row").innerHTML = `
      <div class="stat-card hero">
        <div class="stat-label">Meeting Target ≥ ${TARGET}%</div>
        <div class="stat-value" style="color:${targetColor}">${atTarget} <span style="font-size:1.2rem;color:var(--muted2)">/ ${repos.length}</span></div>
        <div class="stat-sub">${validPcts.length} reporting · ${notReporting} no data</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Fleet Average</div>
        <div class="stat-value" style="color:${statusColor(avg)}">${avg !== null ? avg.toFixed(1) + '%' : '—'}</div>
        <div class="stat-sub">all reporting services</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Highest</div>
        <div class="stat-value" style="color:#6ccf8e">${highest !== null ? highest.toFixed(1) + '%' : '—'}</div>
        <div class="stat-sub">${highestRepo || '—'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Below Target</div>
        <div class="stat-value" style="color:${belowCount > 0 ? '#f2495c' : '#6ccf8e'}">${belowCount}</div>
        <div class="stat-sub">${below60} critical · below 60%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Not Reporting</div>
        <div class="stat-value" style="color:${notReporting > 0 ? '#f5a623' : '#6ccf8e'}">${notReporting}</div>
        <div class="stat-sub">no artifact found</div>
      </div>
    `;

    // ── Fleet trend (average per day) ──
    const dailyAvg = allDates.map(d => {
      const vals = repos
        .map(r => byRepo[r].filter(row => row.date <= d && row.pct !== null).at(-1)?.pct)
        .filter(v => v !== null);
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    });

    const trendVals = dailyAvg.filter(v => v !== null);
    const tMin = trendVals.length ? Math.max(0,   Math.floor(Math.min(...trendVals)) - 3) : 0;
    const tMax = trendVals.length ? Math.min(100, Math.ceil( Math.max(...trendVals)) + 3) : 100;

    new Chart(document.getElementById('trendChart'), {
      type: 'line',
      data: {
        labels: allDates,
        datasets: [{
          data: dailyAvg,
          borderColor: '#5794f2',
          backgroundColor: '#5794f210',
          borderWidth: 2, pointRadius: allDates.length <= 14 ? 3 : 0,
          pointBackgroundColor: '#5794f2',
          spanGaps: true, tension: 0.3, fill: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw !== null ? ctx.raw.toFixed(1) + '%' : 'N/A'}` } },
        },
        scales: {
          x: { ticks: { color: '#8d9099', font: { size: 10 }, maxTicksLimit: 8 }, grid: { color: '#22262b' } },
          y: { min: tMin, max: tMax,
               ticks: { color: '#8d9099', callback: v => v + '%' }, grid: { color: '#22262b' } },
        },
      },
      plugins: [{
        id: 'targetLine',
        afterDraw(chart) {
          if (!chart.scales.y) return;
          const { ctx, chartArea: { left, right }, scales: { y } } = chart;
          if (y.min > TARGET || y.max < TARGET) return;
          const yp = y.getPixelForValue(TARGET);
          ctx.save();
          ctx.setLineDash([5, 3]);
          ctx.beginPath(); ctx.moveTo(left, yp); ctx.lineTo(right, yp);
          ctx.strokeStyle = '#3a3f47'; ctx.lineWidth = 1; ctx.stroke();
          ctx.restore();
        },
      }],
    });

    // ── At Risk: recently-active repos below target ──
    const atRiskList = document.getElementById('at-risk-list');
    const weekAgo = new Date(lastDate);
    weekAgo.setDate(weekAgo.getDate() - 7);
    const isoWeekAgo = weekAgo.toISOString().slice(0, 10);

    const atRisk = repos
      .filter(r => {
        const cur = latest[r];
        if (cur?.pct === null || cur?.pct >= TARGET) return false;
        const pushed = [...byRepo[r]].reverse().map(row => row.pushed_at).find(p => p) || '';
        const days = daysSince(pushed);
        return days !== null && days <= 14;
      })
      .sort((a, b) => (latest[a]?.pct ?? 100) - (latest[b]?.pct ?? 100))
      .slice(0, 6);

    if (atRisk.length === 0) {
      atRiskList.innerHTML = `<div class="insight-empty">No active repos below target</div>`;
    } else {
      const list = document.createElement('div');
      list.className = 'insight-list';
      for (const repo of atRisk) {
        const cur = latest[repo];
        const name = repo.split('/')[1];
        const pushed = [...byRepo[repo]].reverse().map(r => r.pushed_at).find(p => p) || '';
        const days = daysSince(pushed);
        const row = document.createElement('div');
        row.className = 'insight-row';
        row.innerHTML = `
          <div>
            <div class="insight-name">${name}</div>
            <div class="insight-detail">pushed ${days === 0 ? 'today' : days + 'd ago'}</div>
          </div>
          <div class="insight-pct" style="color:${statusColor(cur.pct)}">${cur.pct.toFixed(1)}%</div>
        `;
        list.appendChild(row);
      }
      atRiskList.appendChild(list);
    }

    // ── Pod data ──
    for (const repo of repos) {
      const rows = byRepo[repo];
      const cur  = rows[rows.length - 1];

      const older   = rows.filter(r => r.date <= isoWeekAgo && r.pct !== null);
      const weekRow = older.length ? older[older.length - 1] : null;
      const delta   = cur.pct !== null && weekRow?.pct != null ? cur.pct - weekRow.pct : null;
      const pushedAt = [...rows].reverse().map(r => r.pushed_at).find(p => p) || '';

      podData.push({
        name:      repo.split("/")[1],
        pct:       cur.pct,
        date:      cur.date,
        delta,
        source:    cur.source,
        pushed_at: pushedAt,
        history:   rows.map(r => ({ date: r.date, pct: r.pct })),
      });
    }

    renderPods();

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filterState = btn.dataset.filter;
        renderPods();
      });
    });
  }

  load().catch(err => {
    document.body.innerHTML += `<p style="color:var(--red);margin-top:2rem">Failed to load: ${err.message}</p>`;
  });
</script>
</body>
</html>
