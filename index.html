<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegalSifter Backend Coverage</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    h1 { font-size: 1.5rem; font-weight: 700; color: #f8fafc; }
    .subtitle { font-size: 0.875rem; color: #64748b; margin-top: 0.25rem; }

    .meta { font-size: 0.8rem; color: #475569; text-align: right; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #1e2130;
      border: 1px solid #2d3348;
      border-radius: 8px;
      padding: 1.25rem;
    }

    .stat-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }

    .card {
      background: #1e2130;
      border: 1px solid #2d3348;
      border-radius: 8px;
      padding: 1.25rem;
    }

    .card h2 { font-size: 0.9rem; font-weight: 600; color: #94a3b8; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }

    .chart-wrap { position: relative; height: 280px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th { text-align: left; padding: 0.5rem 0.75rem; color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #2d3348; }
    td { padding: 0.6rem 0.75rem; border-bottom: 1px solid #1a1f2e; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #252a3a; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-green  { background: #14532d; color: #4ade80; }
    .badge-yellow { background: #713f12; color: #fbbf24; }
    .badge-red    { background: #7f1d1d; color: #f87171; }
    .badge-grey   { background: #1e293b; color: #64748b; }

    .source-tag {
      font-size: 0.7rem;
      color: #475569;
      font-style: italic;
    }

    .trend-up   { color: #4ade80; }
    .trend-down { color: #f87171; }
    .trend-flat { color: #64748b; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Backend Coverage Dashboard</h1>
    <div class="subtitle">LegalSifter microservices — unit test coverage</div>
  </div>
  <div class="meta" id="meta">Loading…</div>
</header>

<div class="stats-row" id="stats-row"></div>

<div class="charts-grid">
  <div class="card">
    <h2>Current Coverage by Service</h2>
    <div class="chart-wrap"><canvas id="barChart"></canvas></div>
  </div>
  <div class="card">
    <h2>Coverage Trend Over Time</h2>
    <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
  </div>
</div>

<div class="card">
  <h2>Service Detail</h2>
  <table id="detail-table">
    <thead>
      <tr>
        <th>Service</th>
        <th>Coverage</th>
        <th>Last Updated</th>
        <th>7-day trend</th>
        <th>Source</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  const CSV_URL = "./coverage-history.csv";

  const COLOR_PALETTE = [
    "#6366f1","#22d3ee","#f59e0b","#34d399","#f87171",
    "#a78bfa","#fb923c","#4ade80","#38bdf8","#e879f9",
    "#facc15","#2dd4bf","#f472b6","#60a5fa","#a3e635",
  ];

  function badge(pct) {
    if (pct === null) return `<span class="badge badge-grey">N/A</span>`;
    if (pct >= 80)    return `<span class="badge badge-green">${pct.toFixed(1)}%</span>`;
    if (pct >= 60)    return `<span class="badge badge-yellow">${pct.toFixed(1)}%</span>`;
    return               `<span class="badge badge-red">${pct.toFixed(1)}%</span>`;
  }

  function barColor(pct) {
    if (pct === null) return "#334155";
    if (pct >= 80) return "#4ade80";
    if (pct >= 60) return "#fbbf24";
    return "#f87171";
  }

  function trendArrow(delta) {
    if (delta === null) return `<span class="trend-flat">—</span>`;
    if (delta > 0.5)    return `<span class="trend-up">▲ +${delta.toFixed(1)}%</span>`;
    if (delta < -0.5)   return `<span class="trend-down">▼ ${delta.toFixed(1)}%</span>`;
    return `<span class="trend-flat">→ ${delta > 0 ? '+' : ''}${delta.toFixed(1)}%</span>`;
  }

  async function load() {
    const resp = await fetch(CSV_URL);
    const text = await resp.text();
    const { data } = Papa.parse(text, { header: true, skipEmptyLines: true });

    // Group rows by repo, sort by date within each
    const byRepo = {};
    for (const row of data) {
      if (!byRepo[row.repo]) byRepo[row.repo] = [];
      byRepo[row.repo].push({
        date: row.date,
        pct: row.coverage_pct !== "" ? parseFloat(row.coverage_pct) : null,
        source: row.source,
      });
    }
    for (const r of Object.keys(byRepo)) {
      byRepo[r].sort((a, b) => a.date.localeCompare(b.date));
    }

    // All unique dates
    const allDates = [...new Set(data.map(r => r.date))].sort();
    const repos = Object.keys(byRepo).sort();

    // Latest values
    const latest = {};
    for (const repo of repos) {
      const rows = byRepo[repo];
      latest[repo] = rows[rows.length - 1];
    }

    // Last updated
    const lastDate = allDates[allDates.length - 1];
    document.getElementById("meta").textContent =
      `Last updated ${lastDate} · ${repos.length} services tracked`;

    // Stat cards
    const validPcts = repos.map(r => latest[r]?.pct).filter(p => p !== null);
    const avg = validPcts.length ? validPcts.reduce((a, b) => a + b, 0) / validPcts.length : null;
    const above80 = validPcts.filter(p => p >= 80).length;
    const below60 = validPcts.filter(p => p < 60).length;

    document.getElementById("stats-row").innerHTML = `
      <div class="stat-card">
        <div class="stat-label">Average Coverage</div>
        <div class="stat-value" style="color:${avg >= 80 ? '#4ade80' : avg >= 60 ? '#fbbf24' : '#f87171'}">${avg !== null ? avg.toFixed(1) + '%' : 'N/A'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Services Tracked</div>
        <div class="stat-value" style="color:#6366f1">${repos.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Above 80%</div>
        <div class="stat-value" style="color:#4ade80">${above80}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Below 60%</div>
        <div class="stat-value" style="color:#f87171">${below60}</div>
      </div>
    `;

    // Bar chart
    const barData = repos.map(r => latest[r]?.pct ?? 0);
    new Chart(document.getElementById("barChart"), {
      type: "bar",
      data: {
        labels: repos.map(r => r.split("/")[1]),
        datasets: [{
          data: barData,
          backgroundColor: barData.map(barColor),
          borderRadius: 4,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#94a3b8", font: { size: 10 } }, grid: { color: "#1e293b" } },
          y: {
            min: 0, max: 100,
            ticks: { color: "#94a3b8", callback: v => v + "%" },
            grid: { color: "#2d3348" },
          },
        },
      },
    });

    // Line chart — one dataset per repo, only repos with >1 data point
    const lineDatasets = repos.map((repo, i) => {
      const rows = byRepo[repo];
      const pointsByDate = Object.fromEntries(rows.map(r => [r.date, r.pct]));
      return {
        label: repo.split("/")[1],
        data: allDates.map(d => pointsByDate[d] ?? null),
        borderColor: COLOR_PALETTE[i % COLOR_PALETTE.length],
        backgroundColor: "transparent",
        pointRadius: 2,
        borderWidth: 2,
        spanGaps: true,
        tension: 0.3,
      };
    }).filter((_, i) => byRepo[repos[i]].length > 1);

    new Chart(document.getElementById("lineChart"), {
      type: "line",
      data: { labels: allDates, datasets: lineDatasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: "#94a3b8", font: { size: 10 }, boxWidth: 12 },
          },
        },
        scales: {
          x: { ticks: { color: "#94a3b8", font: { size: 10 }, maxTicksLimit: 10 }, grid: { color: "#1e293b" } },
          y: {
            min: 0, max: 100,
            ticks: { color: "#94a3b8", callback: v => v + "%" },
            grid: { color: "#2d3348" },
          },
        },
      },
    });

    // Detail table
    const tbody = document.querySelector("#detail-table tbody");
    for (const repo of repos) {
      const rows = byRepo[repo];
      const cur = rows[rows.length - 1];

      // 7-day trend: find a row ~7 days ago
      const sevenDaysAgo = new Date(lastDate);
      sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
      const isoWeekAgo = sevenDaysAgo.toISOString().slice(0, 10);
      const older = rows.filter(r => r.date <= isoWeekAgo);
      const weekRow = older.length ? older[older.length - 1] : null;
      const delta = (cur.pct !== null && weekRow?.pct !== null && weekRow?.pct !== undefined)
        ? cur.pct - weekRow.pct
        : null;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${repo.split("/")[1]}</td>
        <td>${badge(cur.pct)}</td>
        <td>${cur.date}</td>
        <td>${trendArrow(delta)}</td>
        <td><span class="source-tag">${cur.source}</span></td>
      `;
      tbody.appendChild(tr);
    }
  }

  load().catch(err => {
    document.body.innerHTML += `<p style="color:#f87171;margin-top:2rem">Failed to load CSV: ${err.message}</p>`;
  });
</script>
</body>
</html>
