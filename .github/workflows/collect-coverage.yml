name: Collect Coverage

on:
  schedule:
    - cron: "0 8 * * *"   # 8am UTC daily
  workflow_dispatch:        # allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect coverage from all repos
        env:
          # Personal access token with read:org + repo scope, SSO-authorized for LegalSifter
          # Store this as a repo secret named COVERAGE_GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.COVERAGE_GITHUB_TOKEN }}
        run: python collect_coverage.py

      - name: Commit updated CSV
        run: |
          git config user.name "coverage-bot"
          git config user.email "coverage-bot@legalsifter.com"
          git add coverage-history.csv
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: coverage update $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
